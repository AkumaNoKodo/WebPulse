services:
  webpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webpulse
    ports:
      - "3000:3000"
    volumes:
      - webpulse_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      - RUST_LOG=info
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/app/webpulse", "--health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  webpulse_data:
    driver: local
